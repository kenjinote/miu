name: Android Build, Unit Test, Lint & AAB Preflight Gate

on:
  push:
    branches: [ master, main ]
    paths:
      - 'Android/**'
      - 'include/**'
      - 'scripts/playstore_upload.py'
      - 'scripts/playstore_metadata_screenshots_sync.py'
      - 'scripts/appstore_metadata_sync.py'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'Android/**'
      - 'include/**'
      - 'scripts/playstore_upload.py'
      - 'scripts/playstore_metadata_screenshots_sync.py'
      - 'scripts/appstore_metadata_sync.py'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-verify:
    name: Build Release APK/AAB, Unit Tests, Lint & Preflight Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK & NDK 27.0.12077973
        uses: android-actions/setup-android@v3

      - name: Install pinned NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build Release APK/AAB, Run Unit Tests & Release Lint
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease testDebugUnitTest lintRelease --no-daemon --stacktrace

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run AAB Preflight Verification Gate (LAUNCHER + Version + 16KB ELF Alignment)
        run: |
          python3 scripts/playstore_upload.py --verify-only
