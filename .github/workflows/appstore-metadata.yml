name: App Store Metadata Sync

on:
  workflow_dispatch:
    inputs:
      target_platform:
        description: "Target platform (all | macos | ios)"
        required: false
        default: "all"
      target_version:
        description: "Optional target version for single-platform submission (e.g. 1.0.56)"
        required: false
        default: ""
      sync_screenshots:
        description: "Also re-render and upload screenshots"
        required: false
        default: "false"
      screenshots_only:
        description: "Only render and replace screenshots (skip text metadata overwrite)"
        required: false
        default: "false"
      force_clean_screenshots:
        description: "Force-replace all existing App Store screenshots"
        required: false
        default: "false"
      submit_for_review:
        description: "Attach build and submit for App Store Review"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync-metadata:
    name: Sync App Store Connect Localizations & Submit
    runs-on: ubuntu-latest
    env:
      HAS_ASC_SECRETS: ${{ secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_PRIVATE_KEY != '' }}
      TARGET_PLATFORM: ${{ github.event.inputs.target_platform }}
      TARGET_VERSION: ${{ github.event.inputs.target_version }}
      SYNC_SCREENSHOTS: ${{ github.event.inputs.sync_screenshots }}
      SCREENSHOTS_ONLY: ${{ github.event.inputs.screenshots_only }}
      FORCE_CLEAN_SCREENSHOTS: ${{ github.event.inputs.force_clean_screenshots }}
      SUBMIT_FOR_REVIEW: ${{ github.event.inputs.submit_for_review }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install multi-script Noto fonts & C++20 toolchain for Retina Screenshot Renderer
        if: env.HAS_ASC_SECRETS == 'true' && (env.SYNC_SCREENSHOTS == 'true' || env.SCREENSHOTS_ONLY == 'true')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ \
            fontconfig \
            fonts-noto-cjk \
            fonts-noto-core \
            fonts-noto-extra \
            fonts-dejavu-core
          if ! command -v google-chrome >/dev/null 2>&1 && ! command -v microsoft-edge >/dev/null 2>&1 && ! command -v chromium >/dev/null 2>&1 && ! command -v chromium-browser >/dev/null 2>&1; then
            sudo apt-get install -y --no-install-recommends chromium-browser || sudo apt-get install -y --no-install-recommends chromium
          fi
          fc-cache -f

      - name: Install Python dependencies
        if: env.HAS_ASC_SECRETS == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/asc_venv"
          "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet \
            "pyjwt==2.10.1" "cryptography==44.0.2" "requests==2.32.3" "pillow==11.1.0" "numpy==2.2.3" || \
          "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet \
            "pyjwt>=2.8,<3" "cryptography>=42" "requests>=2.31,<3" "pillow>=10" "numpy>=1.26"
          echo "$RUNNER_TEMP/asc_venv/bin" >> "$GITHUB_PATH"

      - name: Sync App Store Metadata & Screenshots
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          PLAT="${TARGET_PLATFORM:-all}"
          if [ "${SCREENSHOTS_ONLY:-false}" != "true" ]; then
            if [ "$PLAT" = "macos" ]; then
              VER_ARG="${TARGET_VERSION:-1.0.56}"
              if [ "${SUBMIT_FOR_REVIEW:-false}" = "true" ]; then
                python3 scripts/submit_macos_appstore.py --version "$VER_ARG" --submit
              else
                python3 scripts/submit_macos_appstore.py --version "$VER_ARG"
              fi
            elif [ "$PLAT" = "ios" ]; then
              if [ "${SUBMIT_FOR_REVIEW:-false}" = "true" ]; then
                python3 scripts/appstore_metadata_sync.py --ios-only --submit
              else
                python3 scripts/appstore_metadata_sync.py --ios-only
              fi
            else
              if [ "${SUBMIT_FOR_REVIEW:-false}" = "true" ]; then
                python3 scripts/appstore_metadata_sync.py --submit
              else
                python3 scripts/appstore_metadata_sync.py
              fi
            fi
          fi

          if [ "${SYNC_SCREENSHOTS:-false}" = "true" ] || [ "${SCREENSHOTS_ONLY:-false}" = "true" ]; then
            EXTRA_ARGS=(--platform "$PLAT" --out-dir "$RUNNER_TEMP/asc_screenshots")
            if [ "${FORCE_CLEAN_SCREENSHOTS:-false}" = "true" ]; then
              EXTRA_ARGS+=(--force-clean)
            fi
            python3 scripts/appstore_screenshots_sync.py "${EXTRA_ARGS[@]}"
          fi

      - name: Cleanup temporary files
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$RUNNER_TEMP/asc_screenshots" "$RUNNER_TEMP/asc_private_keys"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8 2>/dev/null || true
