name: App Store Metadata Sync

on:
  workflow_dispatch:
    inputs:
      sync_screenshots:
        description: "Also re-render and upload screenshots"
        required: false
        default: "false"
      submit_for_review:
        description: "Attach build and submit for App Store Review"
        required: false
        default: "false"

permissions:
  contents: read

jobs:
  sync-metadata:
    name: Sync App Store Connect Localizations & Submit
    runs-on: ubuntu-latest
    env:
      HAS_ASC_SECRETS: ${{ secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_PRIVATE_KEY != '' }}
      SYNC_SCREENSHOTS: ${{ github.event.inputs.sync_screenshots }}
      SUBMIT_FOR_REVIEW: ${{ github.event.inputs.submit_for_review }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python dependencies
        if: env.HAS_ASC_SECRETS == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/asc_venv"
          "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet --upgrade pip
          "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet \
            "pyjwt==2.10.1" "cryptography==44.0.2" "requests==2.32.3" "pillow==11.1.0" "numpy==2.2.3" || \
          "$RUNNER_TEMP/asc_venv/bin/pip" install --quiet \
            "pyjwt>=2.8,<3" "cryptography>=42" "requests>=2.31,<3" "pillow>=10" "numpy>=1.26"
          echo "$RUNNER_TEMP/asc_venv/bin" >> "$GITHUB_PATH"

      - name: Sync App Store Metadata
        if: env.HAS_ASC_SECRETS == 'true'
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ "${SUBMIT_FOR_REVIEW:-false}" = "true" ]; then
            python3 scripts/appstore_metadata_sync.py --submit
          else
            python3 scripts/appstore_metadata_sync.py
          fi
          if [ "${SYNC_SCREENSHOTS:-false}" = "true" ]; then
            python3 scripts/appstore_screenshots_sync.py --out-dir "$RUNNER_TEMP/asc_screenshots"
          fi

      - name: Cleanup temporary files
        if: always()
        run: |
          if [ -n "${RUNNER_TEMP:-}" ]; then
            rm -rf "$RUNNER_TEMP/asc_screenshots" "$RUNNER_TEMP/asc_private_keys"
          fi
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8 2>/dev/null || true
