name: macOS & iOS Xcode Build, Test & TestFlight

on:
  push:
    branches: [ master, main, "macos-**" ]
    paths-ignore:
      - 'scripts/appstore_metadata_sync.py'
      - 'scripts/appstore_screenshots_sync.py'
      - 'macOS/store_assets/**'
      - 'macOS/APPSTORE_METADATA.md'
      - '.github/workflows/appstore-metadata.yml'
      - '.github/workflows/macos-build.yml'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  macos-xcodebuild:
    name: Build miu_macOS & miu_iOS + TestFlight Upload
    runs-on: xcode-27
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode & show version
        run: |
          if [ -d "/Applications/Xcode_27.1.app" ]; then
            LATEST_XCODE="/Applications/Xcode_27.1.app"
          else
            LATEST_XCODE=$(ls -d /Applications/Xcode*.app | grep -v -E 'Beta|Release_Candidate' | sort -V | tail -n 1)
          fi
          echo "Selecting Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          sw_vers
          xcodebuild -version

      - name: Validate all 30 Localizable.strings with plutil
        run: |
          plutil -lint macOS/*.lproj/Localizable.strings

      - name: Build universal libced.a (macOS) & libced_iOS.a (iOS)
        run: |
          sh macOS/ci_scripts/ci_post_clone.sh
          lipo -info macOS/libced.a
          lipo -info macOS/libced_iOS.a

      - name: Compile & Run EditorCore Automated Test Suite on macOS
        run: |
          clang++ -std=c++20 -O1 -mmacosx-version-min=13.0 \
            -Iinclude -ImacOS/miu_macOS \
            macOS/tests/test_macos_editor_core.cpp \
            macOS/miu_macOS/EditorCore.cpp \
            macOS/libced.a \
            -framework CoreText -framework CoreFoundation -framework CoreGraphics \
            -o test_macos_editor_core
          ./test_macos_editor_core

          clang++ -std=c++20 -fobjc-arc -O1 -mmacosx-version-min=13.0 \
            -Iinclude -ImacOS/miu_macOS \
            macOS/tests/test_macos_preview_window.mm \
            macOS/miu_macOS/EditorCore.cpp \
            macOS/libced.a \
            -framework Cocoa -framework WebKit -framework CoreText -framework CoreFoundation -framework CoreGraphics \
            -o test_macos_preview_window
          ./test_macos_preview_window

      - name: Unsigned Build Verification (PR / No Secrets)
        if: env.APPSTORE_ISSUER_ID == ''
        run: |
          xcodebuild -project macOS/miu.xcodeproj \
            -target miu_macOS \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          xcodebuild -project macOS/miu.xcodeproj \
            -target miu_iOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive & Upload miu_macOS and miu_iOS to TestFlight
        if: env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_KEY_ID != '' && env.APPSTORE_PRIVATE_KEY != ''
        run: |
          set -e
          mkdir -p ~/.appstoreconnect/private_keys
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf "%s\n" "$APPSTORE_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
            KEYCHAIN_PASS="temp_keychain_pass"
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
            security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple:,codesign:,productsign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
            security find-identity -v "$KEYCHAIN_PATH"
          fi

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>J8HRH6XC73</string>
          </dict>
          </plist>
          EOF

          pip3 install --quiet --break-system-packages pyjwt cryptography requests || pip3 install --quiet pyjwt cryptography requests
          python3 - << 'PYEOF'
          import os, time, jwt, requests

          key_id = os.environ["APPSTORE_KEY_ID"]
          issuer_id = os.environ["APPSTORE_ISSUER_ID"]
          key_path = os.path.expanduser(f"~/.appstoreconnect/private_keys/AuthKey_{key_id}.p8")
          with open(key_path, "r") as f:
              private_key = f.read()

          token = jwt.encode(
              {"iss": issuer_id, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          headers = {"Authorization": f"Bearer {token}"}
          r = requests.get("https://api.appstoreconnect.apple.com/v1/certificates?limit=200", headers=headers)
          if r.status_code == 200:
              certs = r.json().get("data", [])
              dev_types = {"DEVELOPMENT", "IOS_DEVELOPMENT", "MAC_APP_DEVELOPMENT"}
              dev_certs = [c for c in certs if c.get("attributes", {}).get("certificateType") in dev_types]
              print(f"Found {len(dev_certs)} development certificate(s) on App Store Connect.")
              api_dev_certs = [c for c in dev_certs if "API" in (c.get("attributes", {}).get("name", "") + c.get("attributes", {}).get("displayName", ""))]
              targets = api_dev_certs if api_dev_certs else dev_certs[:1]
              for c in targets:
                  cid = c["id"]
                  cname = c.get("attributes", {}).get("name", cid)
                  ctype = c.get("attributes", {}).get("certificateType", "")
                  del_r = requests.delete(f"https://api.appstoreconnect.apple.com/v1/certificates/{cid}", headers=headers)
                  print(f"Revoked dev certificate {cid} ({ctype} - {cname}): HTTP {del_r.status_code}")
          else:
              print(f"Failed to list certificates: HTTP {r.status_code} {r.text}")
          PYEOF

          echo "=== Archiving & Uploading miu_iOS ==="
          xcodebuild -project macOS/miu.xcodeproj \
            -scheme miu_iOS \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/miu_iOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/miu_iOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export_iOS" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" || echo "miu_iOS upload finished or build already exists"

          echo "=== Archiving & Uploading miu_macOS ==="
          xcodebuild -project macOS/miu.xcodeproj \
            -scheme miu \
            -destination "generic/platform=macOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/miu_macOS.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" \
            archive

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/miu_macOS.xcarchive" \
            -exportPath "$RUNNER_TEMP/export_macOS" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" || echo "miu_macOS upload finished or build already exists"
